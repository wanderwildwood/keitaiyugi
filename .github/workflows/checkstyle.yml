name: Checkstyle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run ktlint tests
      # Only the flavour this fork ships. Upstream's `assembleDebug` builds every
      # flavour including playDynamic, which drags in the Google dependencies this
      # app deliberately does not use and took fifteen minutes to tell us so.
      run: ./gradlew :lemuroid-app:assembleFreeBundleDebug ktlintCheck
