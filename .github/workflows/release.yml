name: Release

on:
  push:
    tags:
      - 'v*'
  # Also startable by hand: a tag push can take a long time to produce a run, long enough
  # to look like the push did nothing, and this gives a way to retry one that failed
  # halfway without deleting and re-pushing the tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The cores are a submodule and a large one. Only gambatte is packaged (everything
      # else is excluded in lemuroid-app/build.gradle.kts) but the module still has to be
      # present for the build to resolve, so the checkout cannot skip it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This repo has no checked-in fallback key, so without the secret the build would
      # produce an unsigned release rather than a wrongly-signed one. Fail either way.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build release APK
        run: ./gradlew :lemuroid-app:assembleFreeBundleRelease

      # Signed with the wrong key is not something that can be taken back once people have
      # installed it, so this asserts positively that the APK carries the one expected
      # certificate. A check of the form "it is not <some known wrong key>" passes for
      # every other wrong key and for an unsigned build, which is why it is not used here.
      - name: Verify the signing certificate
        env:
          EXPECTED: 813e7847802726274c4ba901b665994149efa53f253667f6281c7c1f63009b78
        run: |
          apk=$(find lemuroid-app/build/outputs/apk/freeBundle/release -maxdepth 1 -name '*.apk')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $digest, expected $EXPECTED."
            exit 1
          fi

      # Only the Game Boy core should be inside. This is cheap to check and expensive to
      # get wrong: a stray core is tens of megabytes nobody asked to download.
      - name: Verify only the Game Boy core is packaged
        run: |
          apk=$(find lemuroid-app/build/outputs/apk/freeBundle/release -maxdepth 1 -name '*.apk')
          cores=$(unzip -l "$apk" | grep -oE '[a-z0-9_]+_libretro_android\.so' | sort -u)
          echo "$cores"
          if [ "$cores" != "libgambatte_libretro_android.so" ]; then
            echo "::error::Unexpected cores packaged: $cores"
            exit 1
          fi

      - name: Check the version matches the tag
        run: |
          version=$(grep -m1 'versionName = ' lemuroid-app/build.gradle.kts | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::versionName is $version but the tag says $tag."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with in
      # their downloads folder and what a checksum in a forum post refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/keitaiyugi.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          apk_path=$(find lemuroid-app/build/outputs/apk/freeBundle/release -maxdepth 1 -name '*.apk')
          apk_name="keitaiyugi-${GITHUB_REF_NAME}.apk"
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" keitaiyugi.apk
          sha256sum keitaiyugi.apk > keitaiyugi.apk.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # keitaiyugi-*.apk does not match keitaiyugi.apk, so the fixed-name pair is listed.
          files: |
            keitaiyugi-*.apk
            keitaiyugi-*.apk.sha256
            keitaiyugi.apk
            keitaiyugi.apk.sha256
